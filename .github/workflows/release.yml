name: Release Distribution

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: katana
            asset_name: katana-linux-amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: katana
            asset_name: katana-linux-musl-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: katana
            asset_name: katana-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: katana
            asset_name: katana-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: katana.exe
            asset_name: katana-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p katana-cli

      - name: Package artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/katana
          cp README.md LICENSE staging/ 2>/dev/null || true
          tar -czvf ${{ matrix.asset_name }}.tar.gz -C staging .
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/katana.exe
          if (Test-Path README.md) { Copy-Item README.md staging/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE staging/ }
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.asset_name }}.zip"
          (Get-FileHash -Path "${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset_name }}.zip" | Out-File -FilePath "${{ matrix.asset_name }}.zip.sha256" -Encoding ascii

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            *.tar.gz
            *.zip
            *.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified checksums
        working-directory: release-assets
        run: |
          cat *.sha256 > checksums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
